<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard TV</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: none;
      font-family: Arial, sans-serif;
    }

    #dashboard {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      background: #000;
    }

    #status {
      position: fixed;
      right: 14px;
      bottom: 10px;
      padding: 5px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.45);
      color: rgba(255, 255, 255, 0.75);
      font-size: 12px;
      letter-spacing: 0.2px;
      user-select: none;
    }

    #fallback {
      display: none;
      position: fixed;
      inset: 0;
      color: white;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-size: 24px;
      background: #000;
    }
  </style>
</head>

<body>
  <img id="dashboard" src="dashboard.png" alt="Dashboard Power BI" />
  <div id="status">Cargando...</div>

  <div id="fallback">
    No se encontró dashboard.png todavía.<br />
    Ejecuta el workflow de GitHub Actions una vez.
  </div>

  <script>
    const img = document.getElementById("dashboard");
    const status = document.getElementById("status");
    const fallback = document.getElementById("fallback");

    function textoFechaActual() {
      return new Date().toLocaleString("es-MX");
    }

    function actualizarEstado(mensaje) {
      status.textContent = mensaje;
    }

    function cargarImagenInicial() {
      const version = Date.now();
      const url = "dashboard.png?v=" + version;

      img.onload = function () {
        fallback.style.display = "none";
        actualizarEstado("Vista actualizada: " + textoFechaActual());
      };

      img.onerror = function () {
        fallback.style.display = "flex";
        actualizarEstado("Sin imagen");
      };

      img.src = url;
    }

    function refrescarImagenSinParpadeo() {
      const version = Date.now();
      const nuevaUrl = "dashboard.png?v=" + version;

      actualizarEstado("Buscando actualización...");

      const precarga = new Image();

      precarga.onload = function () {
        img.src = nuevaUrl;
        fallback.style.display = "none";
        actualizarEstado("Vista actualizada: " + textoFechaActual());
      };

      precarga.onerror = function () {
        actualizarEstado("No se pudo actualizar. Se mantiene la vista anterior.");
      };

      precarga.src = nuevaUrl;
    }

    cargarImagenInicial();

    // Revisa si hay una nueva imagen cada 30 minutos.
    // Mantiene la imagen anterior visible hasta que la nueva cargue correctamente.
    setInterval(refrescarImagenSinParpadeo, 30 * 60 * 1000);

    // Recarga completa cada 6 horas para evitar que Silk se degrade con el tiempo.
    setInterval(function () {
      window.location.reload();
    }, 6 * 60 * 60 * 1000);
  </script>
</body>
</html>
