<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard TV</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: none;
      font-family: Arial, sans-serif;
    }

    #dashboard {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      background: #000;
    }

    #status {
      position: fixed;
      right: 14px;
      bottom: 10px;
      padding: 5px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.45);
      color: rgba(255, 255, 255, 0.75);
      font-size: 12px;
      letter-spacing: 0.2px;
      user-select: none;
    }

    #fallback {
      display: none;
      position: fixed;
      inset: 0;
      color: white;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-size: 24px;
      background: #000;
    }
  </style>
</head>

<body>
  <img id="dashboard" alt="Dashboard Power BI" />
  <div id="status">Cargando...</div>

  <div id="fallback">
    No se encontraron imágenes todavía.<br />
    Ejecuta el workflow de GitHub Actions una vez.
  </div>

  <script>
    const img = document.getElementById("dashboard");
    const status = document.getElementById("status");
    const fallback = document.getElementById("fallback");

    const pantallas = [
      {
        nombre: "Pantalla 1",
        archivo: "dashboard.png"
      },
      {
        nombre: "Pantalla 2",
        archivo: "dashboard-2.png"
      }
    ];

    let indiceActual = 0;

    function textoFechaActual() {
      return new Date().toLocaleString("es-MX");
    }

    function actualizarEstado(mensaje) {
      status.textContent = mensaje;
    }

    function cargarPantalla(indice) {
      const pantalla = pantallas[indice];
      const version = Date.now();
      const url = pantalla.archivo + "?v=" + version;

      actualizarEstado("Cargando " + pantalla.nombre + "...");

      const precarga = new Image();

      precarga.onload = function () {
        img.src = url;
        fallback.style.display = "none";
        actualizarEstado(
          pantalla.nombre + " | Vista actualizada: " + textoFechaActual()
        );
      };

      precarga.onerror = function () {
        if (!img.src) {
          fallback.style.display = "flex";
          actualizarEstado("Sin imagen disponible");
        } else {
          actualizarEstado(
            "No se pudo cargar " + pantalla.nombre + ". Se mantiene la vista anterior."
          );
        }
      };

      precarga.src = url;
    }

    function siguientePantalla() {
      indiceActual = (indiceActual + 1) % pantallas.length;
      cargarPantalla(indiceActual);
    }

    // Carga inicial.
    cargarPantalla(indiceActual);

    // Alterna entre pantallas cada 30 segundos.
    setInterval(siguientePantalla, 30 * 1000);

    // Recarga completa cada 6 horas para evitar degradación en Silk.
    setInterval(function () {
      window.location.reload();
    }, 6 * 60 * 60 * 1000);
  </script>
</body>
</html>
